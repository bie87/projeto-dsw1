<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Cliente</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        .container {
            max-width: 760px;
            margin: 0 auto;
            padding: 32px 20px;
        }

        .card {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #374151;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 11px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            border: 0;
            border-radius: 8px;
            padding: 11px 16px;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
        }

        .primary {
            background: #2563eb;
            color: #fff;
        }

        .secondary {
            background: #e5e7eb;
            color: #111827;
        }

        @media (max-width: 640px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<main class="container">
    <section class="card">
        <h1>Cadastrar Cliente</h1>

        <div th:if="${sucesso}" style="margin-bottom: 16px; padding: 12px 14px; border-radius: 8px; background: #dcfce7; color: #166534; border: 1px solid #86efac;">
            <span th:text="${sucesso}"></span>
        </div>

        <form th:action="@{/clientes/salvar}" th:object="${cliente}" method="post">
            <input type="hidden" th:field="*{id}">
            <input type="hidden" th:field="*{usuario.id}">

            <div class="grid">
                <div class="full">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" th:field="*{nome}" placeholder="Nome completo" required>
                </div>

                <div>
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" th:field="*{CPF}" placeholder="00000000000" required>
                </div>

                <div>
                    <label for="telefone">Telefone</label>
                    <input type="text" id="telefone" th:field="*{telefone}" placeholder="(11) 99999-9999" required>
                </div>

                <div>
                    <label for="data_nascimento">Data de nascimento</label>
                    <input type="date" id="data_nascimento" th:field="*{data_nascimento}" required>
                </div>

                <div>
                    <label for="sexo">Sexo</label>
                    <input type="text" id="sexo" th:field="*{sexo}" placeholder="M ou F" required>
                </div>

                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" th:field="*{usuario.email}" placeholder="seuemail@exemplo.com" required>
                </div>

                <div>
                    <label for="password">Senha</label>
                    <input type="password" id="password" th:field="*{usuario.password}" placeholder="Senha de acesso" required>
                </div>
            </div>

            <div class="actions">
                <button class="btn primary" type="submit">Salvar cliente</button>
                <a class="btn secondary" th:href="@{/home}">Voltar</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
