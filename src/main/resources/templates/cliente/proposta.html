<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Proposta</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f4f6f8; color: #1f2937; }
        .container { max-width: 760px; margin: 0 auto; padding: 32px 20px; }
        .card { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 8px 24px rgba(0,0,0,.06); }
        h1 { margin-top: 0; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
        .full { grid-column: 1 / -1; }
        label { display: block; margin-bottom: 6px; font-size: 14px; color: #374151; }
        input { width: 100%; box-sizing: border-box; padding: 11px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; }
        .actions { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
        .btn { display: inline-block; border: 0; border-radius: 8px; padding: 11px 16px; text-decoration: none; font-size: 14px; cursor: pointer; }
        .primary { background: #2563eb; color: #fff; }
        .secondary { background: #e5e7eb; color: #111827; }
        @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<main class="container">
    <section class="card">
        <h1>Fazer proposta</h1>

        <p><strong>Cliente:</strong> <span th:text="${cliente.nome}"></span></p>
        <p><strong>Veículo:</strong> <span th:text="${veiculo.modelo}"></span> - <span th:text="${veiculo.ano}"></span></p>
        <p><strong>Loja:</strong> <span th:text="${veiculo.loja != null ? veiculo.loja.nome : '-'}"></span></p>

        <form th:action="@{/cliente/propostas/salvar}" method="post">
            <input type="hidden" name="veiculoId" th:value="${veiculo.id}">

            <div class="grid">
                <div class="full">
                    <label for="valor">Valor da proposta</label>
                    <input type="number" step="0.01" id="valor" name="valor" placeholder="Ex.: 50000.00" required>
                </div>
            </div>

            <div class="actions">
                <button class="btn primary" type="submit">Enviar proposta</button>
                <a class="btn secondary" th:href="@{/cliente/home}">Voltar</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
