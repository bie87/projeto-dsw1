<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Veículo</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        .container {
            max-width: 760px;
            margin: 0 auto;
            padding: 32px 20px;
        }

        .card {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #374151;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 11px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            border: 0;
            border-radius: 8px;
            padding: 11px 16px;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
        }

        .primary {
            background: #2563eb;
            color: #fff;
        }

        .secondary {
            background: #e5e7eb;
            color: #111827;
        }

        @media (max-width: 640px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<main class="container">
    <section class="card">
        <h1>Cadastrar Veículo</h1>

        <div th:if="${sucesso}" style="margin-bottom: 16px; padding: 12px 14px; border-radius: 8px; background: #dcfce7; color: #166534; border: 1px solid #86efac;">
            <span th:text="${sucesso}"></span>
        </div>

        <form th:action="@{/loja/veiculos}" th:object="${veiculo}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="grid">
                <div class="full">
                    <label for="nome">Nome do Veículo</label>
                    <input type="text" id="nome" th:field="*{nome}" placeholder="Ex: Corolla XEI" required>
                </div>

                <div>
                    <label for="modelo">Modelo</label>
                    <input type="text" id="modelo" th:field="*{modelo}" placeholder="Ex: Sedan" required>
                </div>

                <div>
                    <label for="placa">Placa</label>
                    <input type="text" id="placa" th:field="*{placa}" placeholder="ABC1D23" required>
                </div>

                <div class="full">
                    <label for="chassi">Chassi</label>
                    <input type="text" id="chassi" th:field="*{chassi}" placeholder="Número do chassi" required>
                </div>

                <div>
                    <label for="ano">Ano</label>
                    <input type="number" id="ano" th:field="*{ano}" placeholder="Ex: 2023" min="1900" max="2100" required>
                </div>

                <div>
                    <label for="preco">Preço (R$)</label>
                    <input type="number" id="preco" th:field="*{preco}" placeholder="0.00" step="0.01" min="0" required>
                </div>
            </div>

            <div class="actions">
                <button class="btn primary" type="submit">Salvar veículo</button>
                <a class="btn secondary" th:href="@{/loja/home}">Voltar</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
