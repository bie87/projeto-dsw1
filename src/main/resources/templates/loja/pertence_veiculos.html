<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Veículos - Área da Loja</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        .topbar {
            background: #111827;
            color: #fff;
            padding: 20px 24px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px;
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 16px 0 24px;
        }

        .actions a,
        .actions button {
            display: inline-block;
            border: 0;
            border-radius: 8px;
            padding: 10px 14px;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
        }

        .primary {
            background: #2563eb;
            color: #fff;
        }

        .secondary {
            background: #e5e7eb;
            color: #111827;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
        }

        th, td {
            padding: 14px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
        }

        th {
            background: #f9fafb;
        }

        .empty {
            background: #fff;
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
        }
    </style>
</head>
<body>
<header class="topbar">
    <div class="container">
        <h1 th:text="'Veículos de ' + ${loja.nome}">Veículos da Loja</h1>
        <p>Gerencie o catálogo de automóveis da sua empresa.</p>
    </div>
</header>

<main class="container">
    
    <div class="actions">
        <a class="secondary" th:href="@{/loja/home}">Home Loja</a>
        <a class="primary" th:href="@{/loja/veiculos/cadastrar}">Cadastro de Veículo</a>
        <a class="secondary" th:href="@{/loja/veiculos}">Veículos da Loja</a>
        <a class="secondary" th:href="@{/loja/propostas}">Propostas Pendentes</a>
        <a class="secondary" th:href="@{/logout}">Sair</a>
    </div>

    <section th:if="${veiculos == null or #lists.isEmpty(veiculos)}" class="empty">
        Sua loja ainda não possui nenhum veículo cadastrado no estoque.
    </section>

    <table th:if="${veiculos != null and !#lists.isEmpty(veiculos)}">
        <thead>
        <tr>
            <th>Nome</th>
            <th>Modelo</th>
            <th>Placa</th>
            <th>Chassi</th>
            <th>Ano</th>
            <th>Preço</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="veiculo : ${veiculos}">
            <td th:text="${veiculo.nome}"></td>
            <td th:text="${veiculo.modelo}"></td>
            <td th:text="${veiculo.placa}"></td>
            <td th:text="${veiculo.chassi}"></td>
            <td th:text="${veiculo.ano}"></td>
            <td th:text="'R$ ' + ${#numbers.formatDecimal(veiculo.preco, 1, 'POINT', 2, 'COMMA')}"></td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
