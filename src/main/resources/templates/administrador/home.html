<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Sistema de Veículos</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        .topbar {
            background: #111827;
            color: #fff;
            padding: 20px 24px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px;
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 16px 0 24px;
        }

        .actions a,
        .actions button {
            display: inline-block;
            border: 0;
            border-radius: 8px;
            padding: 10px 14px;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
        }

        .primary {
            background: #2563eb;
            color: #fff;
        }

        .secondary {
            background: #e5e7eb;
            color: #111827;
        }

        .search {
            background: #fff;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
            margin-bottom: 24px;
        }

        input {
            width: min(100%, 320px);
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            margin-right: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
        }

        th, td {
            padding: 14px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
        }

        th {
            background: #f9fafb;
        }

        .empty {
            background: #fff;
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
        }
    </style>
</head>
<body>
<header class="topbar">
    <div class="container">
        <h1>Veículos Disponíveis</h1>
        <p>Esta é a página inicial do sistema.</p>
    </div>
</header>

<main class="container">
    
    <div class="actions">
        <a class="secondary" th:href="@{/clientes/cadastrar}">Cadastrar cliente</a>
        <a class="secondary" th:href="@{/lojas/cadastrar}">Cadastrar loja</a>
    </div>

    
</main>
</body>
</html>
